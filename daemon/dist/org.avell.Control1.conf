<?xml version="1.0"?>
<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!-- Only avelld (root) owns the name; anyone may call it. avelld itself refuses changes from
     callers that are not the user of the active local desktop session. -->
<busconfig>
  <policy user="root">
    <allow own="org.avell.Control1"/>
  </policy>
  <policy context="default">
    <allow send_destination="org.avell.Control1"/>
  </policy>
</busconfig>
