# Patched Uniwill platform driver for the Avell A52 MOB:
#  - native DMI match (no force=1, no unsafe-parameter kernel taint)
#  - only features verified on this machine
#  - hwmon pwmN_enable: 0 = full speed (EC fan boost), 1 = manual (255 only), 2 = auto
# Source: linux v7.2.15 drivers/platform/x86/uniwill + Omarchy 0800/0803 patches + patches/0003-avell-a52-dmi-and-fan-boost.patch
PACKAGE_NAME="uniwill-avell"
PACKAGE_VERSION="7.2.15.1"
BUILT_MODULE_NAME[0]="uniwill-laptop"
DEST_MODULE_LOCATION[0]="/kernel/drivers/platform/x86/uniwill"
AUTOINSTALL="yes"
